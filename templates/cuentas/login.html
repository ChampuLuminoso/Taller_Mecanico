{% extends "base.html" %}
{% block titulo %}Entrar · {{ marca.NOMBRE }}{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <h1>Entrar</h1>
  {% if error %}<div class="mensaje error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="email">Correo</label>
    <input id="email" type="email" name="email" value="{{ email }}" autocomplete="email" required autofocus>
    <label for="password">Contraseña</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <div class="check"><label><input type="checkbox" name="recordarme"> Mantener la sesión iniciada en este equipo</label></div>
    <button type="submit">Entrar</button>
  </form>
  <p>¿No tienes cuenta? <a href="{% url 'cuentas:registro' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Regístrate</a></p>
</div>
{% endblock %}
